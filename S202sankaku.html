<!DOCTYPE html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>三角比 学習アプリ</title><style>
*{box-sizing:border-box}body{margin:0;background:#f1f5f9;color:#172b43;font:16px system-ui,sans-serif}main{max-width:1200px;margin:auto;padding:24px}h1{font-size:26px;margin:0 0 6px}p{line-height:1.6;margin:8px 0}section{background:white;border:1px solid #dbe3ed;border-radius:14px;padding:20px} .controls{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:18px 0}button,input{font:inherit;border:1px solid #b8c6d7;border-radius:7px;padding:9px 14px;background:white;color:inherit}button{cursor:pointer}button:hover,button.active{background:#e0edff;border-color:#2563eb}button:focus-visible,tr:focus-visible{outline:3px solid #2563eb}input{width:140px} .layout{display:grid;grid-template-columns:1.15fr 1fr;gap:16px;align-items:start}table{border-collapse:collapse;width:100%;text-align:center;font-variant-numeric:tabular-nums}th,td{border:1px solid #cbd5e1;padding:12px 5px;min-width:48px}th{background:#f0f4f9;font-weight:600}th small{display:block;font-weight:400}tbody tr{cursor:pointer}tbody tr:hover{background:#f1f6ff}tbody tr.active{background:#dbeafe;outline:2px solid #2563eb;outline-offset:-2px}td:first-child{font-weight:700;color:#1d4ed8}.scroll{overflow:auto}svg{width:100%;height:auto;display:block} .legend{display:flex;gap:16px;flex-wrap:wrap;font-weight:600}.r{color:#2563eb}.x{color:#dc2626}.y{color:#15803d}.a{color:#a16207}.frac{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;line-height:1.2}.frac > span:first-child{border-bottom:1px solid currentColor;padding:0 3px}.frac > span:last-child{padding:0 3px}#error{color:#b91c1c}#detail{background:#f1f5f9;padding:12px;border-radius:8px;line-height:2}label{cursor:pointer}@media(max-width:850px){.layout{grid-template-columns:1fr}main{padding:12px}section{padding:12px}} math{font-size:1.12em;vertical-align:middle;font-family:math, "Cambria Math",serif} .quizChoices{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}.quizChoices button{min-height:55px}.quizChoices button.correct{background:#dcfce7;border-color:#15803d}.quizChoices button.wrong{background:#fee2e2;border-color:#b91c1c}#feedback{min-height:2em;font-weight:600} [hidden]{display:none!important} 
.quiz-mode main{padding-top:14px}.quiz-mode .controls{margin:10px 0}.quiz-mode #layout{grid-template-columns:1fr 1fr;align-items:start}.quiz-mode #graph{max-width:440px;margin:auto}.quiz-mode #question{margin:18px 0 10px;font-size:26px}.quiz-mode #feedback,.quiz-mode #score{margin:5px 0}.quiz-mode th{padding:7px 3px}.quiz-mode .quizChoices button{min-height:62px;font-size:20px}.layout.no-graph{grid-template-columns:1fr!important}.quiz-mode .layout.no-graph{max-width:700px;margin:auto}@media(max-width:850px){.quiz-mode #layout{grid-template-columns:1fr}.quiz-mode #graphPanel{grid-row:1}.quiz-mode #graph{max-width:300px}.quiz-mode #graphPanel{padding:8px}.quiz-mode #heading{font-size:14px}.quiz-mode #question{margin:8px 0;font-size:22px}.quiz-mode .quizChoices button{min-height:45px}.quiz-mode .quizChoices{margin:6px 0}.quiz-mode th{padding:4px 2px}}
#stars{display:flex;flex-wrap:wrap;gap:3px 5px;min-height:30px;margin:5px 0 12px;align-items:center}#stars span{color:#d49a00;font-size:25px;line-height:1.1;text-shadow:0 1px 1px #a16207;animation:star-in .35s ease-out both}@keyframes star-in{from{transform:scale(.2);opacity:0}to{transform:scale(1);opacity:1}}@media(prefers-reduced-motion:reduce){#stars span{animation:none}}</style></head><body><main><h1>三角比 学習アプリ</h1><p id="intro">半径 r を選び、表の角度をクリックして座標と三角比の関係を確認しよう。</p><div class="controls" id="radiusControls"><strong>半径 r：</strong><div id="presets"></div><form id="radiusForm" style="display:flex;gap:6px"><input id="radius" aria-label="半径を自由入力" placeholder="例：√3、2.5" value="2"><button>適用</button></form><span id="error" role="alert"></span></div><div class="controls"><button id="learnMode" class="active">学習モード</button><button id="quizMode">出題モード</button><label><input type="checkbox" id="hideGraph" style="width:auto"> 図形を非表示</label></div><div class="layout" id="layout"><section><strong id="tableTitle">三角比の表</strong><p id="answerControl"><label><input id="answers" type="checkbox" checked style="width:auto"> 値を表示する</label></p><div class="scroll"><table><thead><tr><th>θ</th><th class="r">r</th><th class="x">x</th><th class="y">y</th><th>sin θ<small><math><mfrac><mi>y</mi><mi>r</mi></mfrac></math></small></th><th>cos θ<small><math><mfrac><mi>x</mi><mi>r</mi></mfrac></math></small></th><th>tan θ<small><math><mfrac><mi>y</mi><mi>x</mi></mfrac></math></small></th></tr></thead><tbody id="rows"></tbody></table></div><div id="quiz" hidden><h2 id="question"></h2><div id="choices" class="quizChoices"></div><p id="feedback" aria-live="polite"></p><p id="score"></p><div id="stars" aria-label="獲得した星"></div><button id="next">次の問題</button></div><p id="note">※ 90° の tan θ は定義されない。</p></section><section id="graphPanel"><strong id="heading"></strong><div id="graphWrap"><svg id="graph" viewBox="0 0 480 480" role="img" aria-label="円と動径、座標、角度の図"></svg><div class="legend" id="legend"><span class="r">● r：動径</span><span class="x">● x：横の座標</span><span class="y">● y：縦の座標</span><span class="a">● θ：角度</span></div></div><p id="detail"></p></section></div><p id="footerNote">半径を変えても、同じ角度なら sin θ、cos θ、tan θ の値は変わりません。</p></main><script>
const $=id=>document.getElementById(id);const angles=[0,30,45,60,90,120,135,180]; // 添付表と同じ角度
// [分子係数, 根号内, 分母] の組で厳密値を保持
const C=[[1,1,1],[1,3,2],[1,2,2],[1,1,2],[0,1,1],[-1,1,2],[-1,2,2],[-1,1,1]],S=[[0,1,1],[1,1,2],[1,2,2],[1,3,2],[1,1,1],[1,3,2],[1,2,2],[0,1,1]],T=[[0,1,1],[1,3,3],[1,1,1],[1,3,1],null,[-1,3,1],[-1,1,1],[0,1,1]];let index=1,R=2,exact=[2,1,1],radiusText='2';const gcd=(a,b)=>b?gcd(b,a%b):Math.abs(a);function simplify([a,b,c]){if(!a)return [0,1,1];for(let k=2;k*k<=b;k++)while(b%(k*k)===0){a*=k;b/=k*k}let g=gcd(a,c);return [a/g,b,c/g]}function mul(a,b){return simplify([a[0]*b[0],a[1]*b[1],a[2]*b[2]])}function root(b){return '<math><msqrt><mn>'+b+'</mn></msqrt></math>'}function fraction(n,d){const part=v=>String(v).includes('<math>')?'<mrow>'+String(v).replace(/^(\d+)(?=<math>)/,'<mn>$1</mn>').replace(/<\/?math>/g,'')+'</mrow>':'<mn>'+v+'</mn>';return '<math><mfrac>'+part(n)+part(d)+'</mfrac></math>'}function trigFmt(kind,i){return fmt([S,C,T][kind][i])}function fmt(v){if(v===null)return '定義なし';let [a,b,c]=simplify(v);let n=b===1?String(Math.abs(a)):(Math.abs(a)===1?'':Math.abs(a))+root(b);if(b>1&&c%b===0){let d=c/b,g=gcd(Math.abs(a),d);let den=(d/g===1?'':String(d/g))+root(b);return (a<0?'−':'')+fraction(String(Math.abs(a)/g),den)}return (a<0?'−':'')+(c===1?n:fraction(n,c))}const val=([a,b,c])=>a*Math.sqrt(b)/c;const dec=n=>Math.abs(n)<1e-12?'0':String(Number(n.toPrecision(7)));function coord(v){return exact?fmt(mul(exact,v)):dec(R*val(v))}function setRadius(raw){let s=raw.trim().replace(/\s/g,'').replace(/sqrt\((\d+)\)/gi,'√$1');let m=s.match(/^(?:(\d+)?√(\d+)|(\d+(?:\.\d+)?))(?:\/(\d+))?$/);if(!m){$('error').textContent='正の数、√3、3/2 などを入力してください。';return}let n=m[3]?Number(m[3]):Number(m[1]||1)*Math.sqrt(Number(m[2]));let d=Number(m[4]||1);n/=d;if(!Number.isFinite(n)||n<=0||n>1e6){$('error').textContent='0 より大きく100万以下の半径を入力してください。';return}R=n;radiusText=s;exact=m[3]?(Number.isInteger(Number(m[3]))?[Number(m[3]),1,d]:null):[Number(m[1]||1),Number(m[2]),d];$('radius').value=s;$('error').textContent='';render()}for(let s of ['1','2','√2','√3','3']){let b=document.createElement('button');b.textContent=s;b.dataset.radius=s;if(s.startsWith('√'))b.innerHTML=root(s.slice(1));b.style.marginRight='5px';b.onclick=()=>setRadius(s);$('presets').append(b)}$('radiusForm').onsubmit=e=>{e.preventDefault();setRadius($('radius').value)};$('answers').onchange=render;
function render(){const show=!quizMode&&$('answers').checked;[...$('presets').children].forEach(b=>b.classList.toggle('active',b.dataset.radius===radiusText));$('rows').innerHTML=angles.map((a,i)=>`<tr tabindex="0" aria-selected="${i===index}" class="${i===index?'active':''}" data-i="${i}"><td>${a}°</td><td>${exact?fmt(exact):dec(R)}</td><td>${show?coord(C[i]):'　'}</td><td>${show?coord(S[i]):'　'}</td><td>${show?trigFmt(0,i):'　'}</td><td>${show?trigFmt(1,i):'　'}</td><td>${show?trigFmt(2,i):'　'}</td></tr>`).join('');$('rows').querySelectorAll('tr').forEach(tr=>{tr.onclick=()=>{if(quizMode)return;index=+tr.dataset.i;render()};tr.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();if(quizMode)return;index=+tr.dataset.i;render();$('rows').children[index].focus()}}});draw(show)}
function draw(show){let a=angles[index],cx=240,cy=240,scale=175/Math.max(3,R),rr=R*scale,dx=rr*val(C[index]),dy=-rr*val(S[index]),px=cx+dx,py=cy+dy;let h='';const line=(x1,y1,x2,y2,c,w=1,d='')=>`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${c}" stroke-width="${w}" ${d?'stroke-dasharray="'+d+'"':''}/>`;const text=(x,y,s,c='#475569',size=14,anchor='middle')=>`<text x="${x}" y="${y}" fill="${c}" font-size="${size}" text-anchor="${anchor}" font-weight="600" paint-order="stroke" stroke="white" stroke-width="4" stroke-linejoin="round">${s}</text>`;let step=R<=3?0.5:Math.pow(10,Math.floor(Math.log10(R)))/2; if(R/step>12)step*=2;for(let k=-Math.floor(210/(scale*step));k<=Math.floor(210/(scale*step));k++){let v=k*step*scale;h+=line(cx+v,25,cx+v,455,'#e2e8f0')+line(25,cy+v,455,cy+v,'#e2e8f0')}h+=`<circle cx="240" cy="240" r="${rr}" fill="none" stroke="#94a3b8" stroke-width="2"/>`;h+=line(20,cy,460,cy,'#475569',1.5)+line(cx,460,cx,20,'#475569',1.5)+text(465,230,'x')+text(253,22,'y')+text(228,257,'O');for(let k=-Math.floor(175/(scale*step));k<=Math.floor(175/(scale*step));k++){if(!k|| (R<=3&&k%2))continue;h+=text(cx+k*step*scale,cy+21,dec(k*step),'#64748b',11)+text(cx-9,cy-k*step*scale+4,dec(k*step),'#64748b',11,'end')}h+=`<polygon points="${cx},${cy} ${px},${cy} ${px},${py}" fill="#dbeafe" opacity=".65"/>`;h+=line(cx,cy,px,cy,'#dc2626',4)+line(px,cy,px,py,'#15803d',4)+line(cx,cy,px,py,'#2563eb',4);if(dx!==0&&dy!==0){let s=Math.sign(dx);h+=`<path d="M ${px-s*12} ${cy} v -12 h ${s*12}" fill="none" stroke="#64748b"/>`}let rad=a*Math.PI/180,ar=Math.min(38,rr*.4);if(a>0)h+=`<path d="M ${cx+ar} ${cy} A ${ar} ${ar} 0 0 0 ${cx+ar*Math.cos(rad)} ${cy-ar*Math.sin(rad)}" fill="none" stroke="#a16207" stroke-width="3"/>`;h+=text(cx+(ar+16)*Math.cos(rad/2),cy-(ar+16)*Math.sin(rad/2)-5,'θ = '+a+'°','#a16207');h+=text((cx+px)/2,cy+39,'x','#dc2626',17);h+=text(px+(dx<0?-15:15),(cy+py)/2-5,'y','#15803d',17,dx<0?'end':'start');h+=text((cx+px)/2+(a===90?20:0),(cy+py)/2-17,'r','#2563eb',17);h+=`<circle cx="${px}" cy="${py}" r="5" fill="#172b43"/>`+text(px+(dx<0?8:-8),py-13,'P','#172b43',16,dx<0?'start':'end');$('graph').innerHTML=h;$('heading').textContent='座標平面：θ = '+a+'°';$('detail').innerHTML=show?`P = (${coord(C[index])}, ${coord(S[index])})<br>sin θ = ${fmt(S[index])}　 cos θ = ${fmt(C[index])}<br>tan θ = ${trigFmt(2,index)}`:'P = (x, y)　　r = '+(exact?fmt(exact):dec(R));}
let quizMode=false,kind=0,total=0,correct=0,answered=false,previous=-1;const names=['sin','cos','tan'];let deck=[];function shuffle(a){for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function nextQuestion(){if(!deck.length){deck=shuffle(Array.from({length:angles.length*names.length},(_,i)=>i));if(deck[0]===previous)[deck[0],deck[1]]=[deck[1],deck[0]]}let q=deck.shift();previous=q;index=Math.floor(q/3);kind=q%3;answered=false;render();$('question').textContent=names[kind]+' '+angles[index]+'° の値は？';$('feedback').textContent='';$('next').disabled=true;let pool=[];for(let k=0;k<3;k++)for(let i=0;i<angles.length;i++){let v=[S,C,T][k][i],key=v===null?'undefined':val(v).toFixed(9);if(!pool.some(z=>z.key===key))pool.push({key,html:trigFmt(k,i)})}let v=[S,C,T][kind][index],key=v===null?'undefined':val(v).toFixed(9);let options=[{key,html:trigFmt(kind,index)},...shuffle(pool.filter(z=>z.key!==key)).slice(0,5)];shuffle(options);$('choices').replaceChildren();for(let o of options){let b=document.createElement('button');b.innerHTML=o.html;b.onclick=()=>{if(answered)return;answered=true;total++;if(o.key===key){correct++;let star=document.createElement('span');star.textContent='★';star.setAttribute('aria-hidden','true');$('stars').append(star);$('stars').setAttribute('aria-label','獲得した星：'+correct+'個');}b.classList.add(o.key===key?'correct':'wrong');for(let el of $('choices').children){el.disabled=true;if(el.dataset.key===key)el.classList.add('correct')}$('feedback').innerHTML=(o.key===key?'正解！':'不正解。正解は ')+trigFmt(kind,index);$('score').textContent='正解数：'+correct+' / '+total;$('next').disabled=false};b.dataset.key=o.key;$('choices').append(b)}}$('next').onclick=nextQuestion;function setMode(q){if(q===quizMode)return;quizMode=q;document.body.classList.toggle("quiz-mode",q);for(const id of ["rows","tableTitle","note","intro","footerNote","radiusControls","detail","legend"]) $(id).hidden=q;updateGraphVisibility();$('quiz').hidden=!q;$('answerControl').hidden=q;$('learnMode').classList.toggle('active',!q);$('quizMode').classList.toggle('active',q);if(q){total=correct=0;deck=[];previous=-1;$('stars').replaceChildren();$('stars').setAttribute('aria-label','獲得した星：0個');$('score').textContent='正解数：0 / 0';nextQuestion()}else render()}$('learnMode').onclick=()=>setMode(false);$('quizMode').onclick=()=>setMode(true);function updateGraphVisibility(){const hide=$('hideGraph').checked;$('graphPanel').hidden=hide;$('detail').hidden=hide||quizMode;$('layout').classList.toggle('no-graph',hide)}$('hideGraph').onchange=updateGraphVisibility;render();</script></body></html>
